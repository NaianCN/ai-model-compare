<title>Arena 排行榜</title>
<style>
:root{
  --bg:#ffffff; --fg:#0b0b0b; --sec:#52514e; --muted:#898781;
  --card:#fcfcfb; --grid:rgba(137,135,129,0.22); --line:#e1e0d9; --sel:#0b0b0b; --selfg:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161615; --fg:#f0efec; --sec:#c3c2b7; --muted:#898781;
    --card:#1c1c1b; --grid:rgba(137,135,129,0.22); --line:#383835; --sel:#f0efec; --selfg:#161615; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161615; --fg:#f0efec; --sec:#c3c2b7; --muted:#898781;
  --card:#1c1c1b; --grid:rgba(137,135,129,0.22); --line:#383835; --sel:#f0efec; --selfg:#161615; color-scheme:dark;
}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.6 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
}
.wrap{
  max-width:1100px; margin:0 auto; padding-block:28px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
h1{font-size:22px; font-weight:600; margin:0 0 4px; text-wrap:balance}
h2{font-size:16px; font-weight:600; margin:0 0 2px}
.sub{color:var(--sec); margin:0 0 20px; text-wrap:pretty}
.sub a{color:inherit}
.head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap}
.export{flex:none; font:inherit; font-size:13px; color:var(--fg); background:var(--card); border:0.5px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer}
.export:disabled{opacity:.6; cursor:default}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; margin:0 0 16px}
.parts{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--sec)}
.parts label, .pick label{display:inline-flex; align-items:center; gap:5px; cursor:pointer}
.tools{display:flex; align-items:center; gap:8px; position:relative}
.pick summary{list-style:none; font-size:13px; color:var(--fg); background:var(--card); border:0.5px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap}
.pick summary::-webkit-details-marker{display:none}
.pick summary::after{content:"▾"; margin-left:6px; color:var(--muted)}
.pick-body{position:absolute; right:0; top:calc(100% + 6px); z-index:5; width:min(420px, calc(100vw - 32px)); max-height:60vh; overflow:auto; background:var(--bg); border:0.5px solid var(--line); border-radius:10px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.12); font-size:13px}
.pick-act{display:flex; gap:6px; margin-bottom:8px}
.pick-act button{font:inherit; font-size:12px; color:var(--sec); background:none; border:0.5px solid var(--line); border-radius:6px; padding:2px 10px; cursor:pointer}
.pick fieldset{border:0; margin:0 0 8px; padding:0}
.pick legend{font-weight:600; color:var(--fg); padding:0; margin-bottom:2px}
.pick fieldset div{display:flex; flex-wrap:wrap; gap:4px 14px; color:var(--sec)}
.pick .en{font-size:11px; color:var(--muted)}
#board-block{display:flex; flex-direction:column}
.card{background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:16px}
.nav{margin:0 0 16px}
.groups{display:inline-flex; flex-wrap:wrap; gap:2px; padding:3px; border:0.5px solid var(--line); border-radius:10px; background:var(--card)}
.groups button, .boards button{font:inherit; font-size:13px; border:0; background:none; color:var(--sec); cursor:pointer; border-radius:7px; padding:5px 14px}
@media (max-width:600px){ .groups{display:grid; grid-template-columns:repeat(5, 1fr); width:100%; box-sizing:border-box} .groups button{padding:5px 0} .groups .en{display:none} }
.groups button[aria-selected="true"]{background:var(--sel); color:var(--selfg); font-weight:600}
.groups .en, .boards .en{margin-left:5px; font-size:11px; font-weight:400; opacity:.7}
.boards{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.boards button{border:0.5px solid var(--line); padding:4px 12px}
.boards button[aria-selected="true"]{border-color:var(--fg); color:var(--fg); font-weight:600}
.desc{font-size:13px; line-height:1.65; margin:4px 0 6px; max-width:880px}
.meta{color:var(--sec); font-size:12px; margin:0 0 12px}
.chart{position:relative; height:520px}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px; padding-top:12px; border-top:0.5px solid var(--line); font-size:12px; color:var(--sec)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend small.hint{font-size:10.5px; color:var(--muted); margin-left:-2px}
.sw{display:inline-block; width:10px; height:10px; border-radius:3px; flex:none}
.sw.hatch{background-image:repeating-linear-gradient(135deg, currentColor 0 2px, transparent 2px 4px); border:1px solid currentColor; box-sizing:border-box}
.tablewrap{overflow-x:auto; border:0.5px solid var(--line); border-radius:12px; background:var(--card); margin-top:16px}
table{border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums}
th,td{padding:8px 12px; vertical-align:middle; line-height:20px; text-align:left; border-bottom:0.5px solid var(--line); white-space:nowrap}
th{color:var(--sec); font-weight:600}
td.num, th.num{text-align:right; width:1%; padding-left:28px}
th:first-child, td:first-child{padding-left:16px}
th:last-child, td:last-child{padding-right:16px}
td.rank{color:var(--muted); padding-left:16px}
tbody tr:last-child td{border-bottom:0}
td.muted{color:var(--muted)}
.vend{display:flex; align-items:center; gap:6px; height:20px}
.vend img{width:16px; height:16px; border-radius:4px; background:#fff; padding:1px; box-sizing:border-box}
.vend i{display:inline-block; width:10px; height:10px; border-radius:50%}
.tag{display:inline-block; line-height:16px; vertical-align:1px; font-size:11px; color:var(--muted); border:0.5px solid var(--line); border-radius:4px; padding:0 4px; margin-left:6px}
.notes-sec{margin-top:28px; padding:0 16px}
.notes-sec h2{font-size:14px; margin:0 0 8px}
ul.notes{padding:0 0 0 18px; margin:0; color:var(--sec); font-size:13px}
ul.notes li{margin-bottom:6px}
</style>

    </div>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="parts">
      <label><input type="checkbox" data-part="head" checked> 标题与来源</label>
      <label><input type="checkbox" data-part="chart" checked> 条形图</label>
      <label><input type="checkbox" data-part="table" checked> 数据表</label>

        </div>
      </details>
      <button class="export" id="export" type="button">导出为图片</button>
    </div>
  </div>

  <div class="nav" id="nav">
    <div class="groups" role="tablist" id="groups" aria-label="大类"></div>
    <div class="boards" role="tablist" id="boards" aria-label="榜单"></div>
  </div>

  <div id="board-block">
  <section class="card" id="part-chart">
    <h2 id="b-title"></h2>
    <p class="desc" id="b-desc"></p>
    <p class="meta" id="b-meta"></p>
    <div class="chart" id="chart-box"><canvas id="cb" role="img"></canvas></div>
    <div class="legend" id="legend"></div>
  </section>

  <div class="tablewrap" id="part-table">
    <table>
      <thead id="t-head"></thead>
      <tbody id="t-body"></tbody>
    </table>
  </div>
  </div>

  <section class="notes-sec" id="part-notes">
    <h2>数据说明</h2>
    <ul class="notes">
      <li>数据来自 <a href="https://arena.ai/leaderboard">Arena</a>。盲评分数只在同榜内比较，智能体任务和对齐指数采用各自的指标。</li>
      <li>横轴从接近最低分处起画。细线为置信区间，更新榜单采用以分数为中心的近似区间，斜纹表示初步排名。</li>
      <li>花费为 Arena 公布的中位数，按任务、单张图或单段视频列示。</li>
    </ul>
  </section>
</div>

<script>
// 导出压缩：量化成 256 色 PNG，分辨率不变；压缩组件没加载时退回普通 PNG
function smallPng(canvas, done){
  try {
    var w = canvas.width, h = canvas.height;
    var rgba = canvas.getContext('2d').getImageData(0, 0, w, h).data.buffer;
    done(new Blob([UPNG.encode([rgba], w, h, 256)], {type:'image/png'}));
  } catch (e) {
    canvas.toBlob(done, 'image/png');
  }
}
</script>

  var THEME = {};
  function readTheme(){
    var cs = getComputedStyle(document.documentElement);
    function g(k, d){ return (cs.getPropertyValue(k) || '').trim() || d; }
    THEME.muted = g('--muted', '#898781');
    THEME.sec = g('--sec', '#52514e');
    THEME.fg = g('--fg', '#0b0b0b');
    THEME.grid = g('--grid', 'rgba(137,135,129,0.22)');
    THEME.dark = (cs.colorScheme || '').indexOf('dark') !== -1;
  }
  readTheme();

  function tone(hex){
    if (!THEME.dark) return hex;
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r + (255 - r) * 0.45);
    g = Math.round(g + (255 - g) * 0.45);
    b = Math.round(b + (255 - b) * 0.45);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function tint(c, a){
    var rgb = c.charAt(0) === '#'
      ? [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]
      : c.match(/\d+/g).slice(0, 3);
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
  }
  function hatch(color){
    var c = document.createElement('canvas');
    c.width = 8; c.height = 8;
    var g = c.getContext('2d');
    g.strokeStyle = color; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(-2, 10); g.lineTo(10, -2);
    g.moveTo(-2, 2); g.lineTo(2, -2);
    g.moveTo(6, 10); g.lineTo(10, 6);
    g.stroke();
    return g.createPattern(c, 'repeat');
  }
  function vcolor(v){ return tone(VENDOR_COLOR[v] || '#898781'); }
  function fmt(n){ return n == null ? '' : n.toLocaleString('en-US'); }
  function val(b, v){ return b.unit === '%' ? v.toFixed(2) + '%' : String(v); }
  function ci(b, e){ return b.unit === '%' ? e.toFixed(2) : String(e); }

  var cur = {group:'Chat', board:'chat/text'};

  function boardOf(path){
    for (var i = 0; i < GROUPS.length; i++)
      for (var j = 0; j < GROUPS[i].boards.length; j++)
        if (GROUPS[i].boards[j].path === path) return GROUPS[i].boards[j];
  }

  function narrow(){ return document.getElementById('chart-box').clientWidth < 520; }

  var barLabels = {id:'barLabels', afterDatasetsDraw:function(ch){
    var ctx = ch.ctx, x = ch.scales.x;
    ctx.save();
    ctx.font = '11px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    // 左侧排名列：右对齐，与左对齐的型号名分成两列
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = THEME.muted;
    ch.getDatasetMeta(0).data.forEach(function(el, i){
      if (ROWS[i]) ctx.fillText('#' + ROWS[i][0], ch.scales.y.left - 6, el.y);
    });
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ch.getDatasetMeta(0).data.forEach(function(el, i){
      var r = ROWS[i];
      if (!r) return;
      var c = vcolor(r[2]);
      var end = el.x;
      if (r[4] != null){
        var lo = x.getPixelForValue(r[3] - r[4]), hi = x.getPixelForValue(r[3] + r[4]);
        ctx.strokeStyle = THEME.dark ? 'rgba(240,239,236,0.55)' : 'rgba(11,11,11,0.45)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(lo, el.y); ctx.lineTo(hi, el.y);
        ctx.moveTo(lo, el.y - 3); ctx.lineTo(lo, el.y + 3);
        ctx.moveTo(hi, el.y - 3); ctx.lineTo(hi, el.y + 3);
        ctx.stroke();
        end = Math.max(end, hi);
      }
      var t = val(B, r[3]) + (r[4] != null ? ' ±' + ci(B, r[4]) : '');
      if (r[6] != null && !narrow()) t += ' · ' + fmt(r[6]) + ' ' + B.count;
      ctx.fillStyle = c;
      ctx.fillText(t, end + 6, el.y);
    });

  }};

  var chart = new Chart(document.getElementById('cb'), {

  function niceStep(span){
    var raw = span / (narrow() ? 3 : 6), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }

  function renderChart(){
    var lo = Infinity, hi = -Infinity;
    ROWS.forEach(function(r){
      var e = r[4] || 0;
      lo = Math.min(lo, r[3] - e); hi = Math.max(hi, r[3] + e);
    });
    var step = niceStep(hi - lo);
    var min = Math.floor((lo - step * 0.5) / step) * step;
    if (B.unit === '%' && min < 0) min = 0;
    var max = Math.ceil(hi / step) * step;
    chart.options.layout.padding.right = narrow() ? 70 : 150;
    var ds = chart.data.datasets[0];
    chart.data.labels = ROWS.map(function(r){ return r[1]; });
    ds.data = ROWS.map(function(r){ return r[3]; });

    ds.borderColor = ROWS.map(function(r){ return vcolor(r[2]); });
    var x = chart.options.scales.x;
    x.min = min; x.max = max;
    x.ticks.stepSize = step;
    x.ticks.callback = function(v){ return B.unit === '%' ? v + '%' : v; };
    x.title.text = B.metric + (B.unit === '%' ? '（%）' : '') + '，从 ' + min + (B.unit) + ' 起';
    x.title.color = THEME.muted; x.ticks.color = THEME.muted; x.grid.color = THEME.grid;

  }

    var td = el('td'), s = el('span', null, 'vend');
    if (LOGO_KEY[v] && LOGOS[LOGO_KEY[v]]){
      var img = el('img'); img.src = LOGOS[LOGO_KEY[v]]; img.alt = ''; s.appendChild(img);
    } else {
      var i = el('i'); i.style.background = vcolor(v); s.appendChild(i);
    }
    s.appendChild(document.createTextNode(v));
    td.appendChild(s);
    return td;
  }

  function costLabel(board){
    var group = board.path.split('/')[0];
    return (group === 'image' ? '每张图花费' : group === 'video' ? '每段视频花费' : '每任务花费') + '（P50）';
  }
  function renderTable(){
    var hasPrice = ROWS.some(function(r){ return r[7] != null; });
    var hasCost = ROWS.some(function(r){ return r[8]; });
    var cols = [['排名', 'num'], ['型号'], ['厂商'], [B.metric, 'num'], ['± 区间', 'num']];
    if (B.count) cols.push([B.count + '数', 'num']);
    if (hasCost) cols.push([costLabel(B), 'num']);
    if (hasPrice) cols.push(['价格 $/M（入 / 出）', 'num']);
    var th = document.getElementById('t-head'); th.textContent = '';
    var tr = el('tr');
    cols.forEach(function(c){ tr.appendChild(el('th', c[0], c[1])); });
    th.appendChild(tr);
    var tb = document.getElementById('t-body'); tb.textContent = '';
    ROWS.forEach(function(r){
      var tr = el('tr');
      tr.appendChild(el('td', r[0], 'num rank'));
      var name = el('td', r[1]);
      if (r[5]) name.appendChild(el('span', 'Preliminary', 'tag'));
      tr.appendChild(name);
      tr.appendChild(vendorCell(r[2]));
      tr.appendChild(el('td', val(B, r[3]), 'num'));
      tr.appendChild(el('td', r[4] == null ? '' : '±' + ci(B, r[4]), 'num'));
      if (B.count) tr.appendChild(el('td', fmt(r[6]), 'num'));
      if (hasCost) tr.appendChild(el('td', r[8] || '', 'num'));
      if (hasPrice) tr.appendChild(el('td', r[7] || '', 'num' + (r[7] === 'N/A' ? ' muted' : '')));
      tb.appendChild(tr);
    });
  }

  function renderLegend(){
    var lg = document.getElementById('legend'); lg.textContent = '';
    var seen = [];
    ROWS.forEach(function(r){ if (seen.indexOf(r[2]) === -1) seen.push(r[2]); });
    seen.forEach(function(v){
      var s = el('span'), sw = el('i', null, 'sw');
      sw.style.background = vcolor(v);
      s.appendChild(sw); s.appendChild(document.createTextNode(v));
      lg.appendChild(s);
    });
    if (ROWS.some(function(r){ return r[5]; })){
      var s = el('span'), sw = el('i', null, 'sw hatch');
      sw.style.color = THEME.sec;
      s.appendChild(sw); s.appendChild(document.createTextNode('斜纹 = Preliminary'));
      s.appendChild(el('small', '初步排名：票数较少，名次可能变动', 'hint'));
      lg.appendChild(s);
    }
  }

  function renderNav(){
    var gEl = document.getElementById('groups'), bEl = document.getElementById('boards');
    gEl.textContent = ''; bEl.textContent = '';
    GROUPS.forEach(function(g){
      var b = el('button', g.zh); b.appendChild(el('span', g.key, 'en')); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', g.key === cur.group ? 'true' : 'false');
      b.addEventListener('click', function(){ select(g.key, g.boards[0].path); });
      gEl.appendChild(b);
    });
    GROUPS.filter(function(g){ return g.key === cur.group; })[0].boards.forEach(function(bd){
      var b = el('button', bd.zh); b.appendChild(el('span', bd.name, 'en')); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', bd.path === cur.board ? 'true' : 'false');
      b.addEventListener('click', function(){ select(cur.group, bd.path); });
      bEl.appendChild(b);
    });
  }

  function select(group, path){
    cur = {group:group, board:path};
    try { localStorage.setItem('arena-board', JSON.stringify(cur)); } catch (e) {}
    B = boardOf(path);
    var d = DATA[path];
    ROWS = d.rows;
    var G = GROUPS.filter(function(g){ return g.key === group; })[0];
    document.getElementById('b-title').textContent = G.zh + ' ' + group + ' › ' + B.zh + ' ' + B.name;
    document.getElementById('b-desc').textContent = B.desc;
    document.getElementById('b-meta').textContent = '第 1–' + ROWS.length + ' 名，共 ' + d.total + ' 个型号上榜 · ' + 'Arena 榜单日期 ' + d.date + ' · ' + '指标：' + B.metric + ' · 来源 arena.ai/leaderboard/' + path;
    renderNav();
    renderChart();
    renderTable();
    renderLegend();
  }
  select(cur.group, cur.board);

  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function(){ readTheme(); select(cur.group, cur.board); });
  }

  // ---- 导出：分区多选 + 榜单多选，拼成一张图 ----
  var btn = document.getElementById('export');
  var toolbar = document.getElementById('toolbar');
  var pick = document.getElementById('pick');
  var pickList = document.getElementById('pick-list');
  var pickTouched = false;

  GROUPS.forEach(function(g){
    var fs = el('fieldset'), lg = el('legend', g.zh + ' '), row = el('div');
    lg.appendChild(el('span', g.key, 'en'));
    fs.appendChild(lg);
    g.boards.forEach(function(bd){
      var lb = el('label'), cb = el('input');
      cb.type = 'checkbox'; cb.value = bd.path; cb.dataset.group = g.key;
      lb.appendChild(cb);
      lb.appendChild(document.createTextNode(bd.zh + ' '));
      lb.appendChild(el('span', bd.name, 'en'));
      row.appendChild(lb);
    });
    fs.appendChild(row);
    pickList.appendChild(fs);
  });
  function boxes(){ return [].slice.call(pickList.querySelectorAll('input')); }
  function syncPick(){
    if (!pickTouched) boxes().forEach(function(c){ c.checked = c.value === cur.board; });
    var on = boxes().filter(function(c){ return c.checked; });
    document.getElementById('pick-sum').textContent =
      !pickTouched ? '当前榜单' : on.length === 0 ? '未选' : on.length === boxes().length ? '全部 ' + on.length + ' 个' : on.length === 1 ? boardOf(on[0].value).zh : on.length + ' 个';
  }
  pickList.addEventListener('change', function(){ pickTouched = true; syncPick(); });
  pick.querySelector('.pick-act').addEventListener('click', function(e){
    var act = e.target.dataset && e.target.dataset.act;
    if (!act) return;
    pickTouched = act !== 'cur';
    boxes().forEach(function(c){ c.checked = act === 'all' ? true : act === 'cur' ? c.value === cur.board : false; });
    syncPick();
  });
  document.addEventListener('click', function(e){ if (pick.open && !pick.contains(e.target)) pick.open = false; });
  var _select = select;
  select = function(g, p){ _select(g, p); syncPick(); };
  syncPick();

  function partOn(k){ var c = toolbar.querySelector('input[data-part="' + k + '"]'); return c && c.checked; }
  function frame(){ return new Promise(function(r){ requestAnimationFrame(function(){ requestAnimationFrame(r); }); }); }

  btn.addEventListener('click', function(){
    if (typeof html2canvas !== 'function'){
      alert('导出组件加载失败，请检查网络后重试。');
      return;
    }
    var parts = {head:partOn('head'), chart:partOn('chart'), table:partOn('table'), notes:partOn('notes')};
    var paths = boxes().filter(function(c){ return c.checked; }).map(function(c){ return [c.dataset.group, c.value]; });
    var withBoards = parts.chart || parts.table;
    if (withBoards && !paths.length){ alert('请至少选择一个榜单。'); return; }
    if (!parts.head && !parts.notes && !withBoards){ alert('请至少勾选一个分区。'); return; }
    if (!withBoards) paths = [];

    var keep = {group:cur.group, board:cur.board};
    var head = document.getElementById('part-head'), nav = document.getElementById('nav');
    var notes = document.getElementById('part-notes'), block = document.getElementById('board-block');
    var chartEl = document.getElementById('part-chart'), tableEl = document.getElementById('part-table');
    var bg = getComputedStyle(document.body).backgroundColor;
    var label = btn.textContent, inputs = toolbar.querySelectorAll('input, button');
    pick.open = false;
    inputs.forEach(function(i){ i.disabled = true; });
    btn.textContent = '导出中…';
    toolbar.hidden = true; nav.hidden = true;
    chartEl.hidden = !parts.chart; tableEl.hidden = !parts.table;
    tableEl.style.marginTop = parts.chart ? '' : '0';

    // 导出时固定按桌面宽度排版，窄窗口下表格也不会被横向截断
    var wrap = document.querySelector('.wrap'), EXPORT_W = 1100;
    wrap.style.width = EXPORT_W + 'px'; wrap.style.maxWidth = 'none';
    function snap(node){ return html2canvas(node, {backgroundColor:bg, scale:scale, windowWidth:Math.max(window.innerWidth, EXPORT_W + 40)}); }

    var shots = [], scale = 2;
    var chain = frame().then(function(){
      // 按估算总高度降低倍率，避免超过浏览器画布上限（约 16000px / 1600 万像素）
      var W = wrap.clientWidth;
      var estH = (parts.head ? head.offsetHeight : 0) + (parts.notes ? notes.offsetHeight + 20 : 0) + paths.length * (block.offsetHeight + 32) + 64;
      scale = Math.max(2, window.devicePixelRatio || 1);
      scale = Math.max(0.75, Math.min(scale, 15000 / estH, Math.sqrt(1.5e7 / (W * estH))));
    });
    if (parts.head) chain = chain.then(function(){ return snap(head); }).then(function(c){ shots.push(c); });
    paths.forEach(function(p){
      chain = chain.then(function(){ _select(p[0], p[1]); return frame(); })
        .then(function(){ return snap(block); })
        .then(function(c){ shots.push(c); });
    });
    if (parts.notes) chain = chain.then(function(){ return snap(notes); }).then(function(c){ shots.push(c); });

    chain.then(function(){
      var pad = Math.round(16 * scale), gap = Math.round(24 * scale);
      var w = Math.max.apply(null, shots.map(function(c){ return c.width; })) + pad * 2;
      var h = shots.reduce(function(t, c){ return t + c.height; }, 0) + gap * (shots.length - 1) + pad * 2;
      var out = document.createElement('canvas');
      out.width = w; out.height = h;
      var g = out.getContext('2d');
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      var y = pad;
      shots.forEach(function(c){ g.drawImage(c, pad, y); y += c.height + gap; });
      var name = paths.length === 1 ? boardOf(paths[0][1]).zh + ' ' + boardOf(paths[0][1]).name
        : paths.length ? paths.length + ' 个榜单' : '说明';
      return new Promise(function(res, rej){
        smallPng(out, function(blob){
          if (!blob) return rej(new Error('图片过大，请少选几个榜单'));
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = document.title + '（' + name + '）.png';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
          res();
        });
      });
    }).catch(function(err){
      console.error(err);
      alert('导出失败：' + err.message);
    }).then(function(){
      toolbar.hidden = false; nav.hidden = false;
      wrap.style.width = ''; wrap.style.maxWidth = '';
      chartEl.hidden = false; tableEl.hidden = false; tableEl.style.marginTop = '';
      _select(keep.group, keep.board);
      syncPick();
      inputs.forEach(function(i){ i.disabled = false; });
      btn.textContent = label;
    });
  });
})();
</script>
</body></html>
